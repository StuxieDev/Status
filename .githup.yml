# StuxieDev Status: https://status.stuxie.dev
# Checked every 5 minutes by .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: StuxieDev Status
  description: Live status of StuxieDev's websites and projects, checked every 5 minutes.
  logo: https://global.media.stuxie.dev/logo.png
  favicon: https://global.media.stuxie.dev/icon.png
  accent: "#9b4f96"
  url: https://status.stuxie.dev/
  footer_links:
    - label: StuxieDev
      url: https://stuxie.dev/
    - label: Report a problem
      url: https://github.com/StuxieDev/Status/issues/new

legal:
  operator: StuxieDev
  company: "StuxieDev is an independent project of Leo Ridgwell, operating as StuxieDev. It is not operated by any company or organization."
  contact: legal@stuxie.dev
  host: GitHub Pages
  effective: 1 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Ungrouped monitors are listed first.
monitors:
  - name: StuxieDev
    url: https://stuxie.dev/
    description: The StuxieDev website
  - name: StuxieDev Media CDN
    url: https://global.media.stuxie.dev/icon.png
    description: Shared logos and images used across every StuxieDev site

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
groups:
  - name: Projects
    description: StuxieDev's project hub and its game mod sites.
    monitors:
      - name: Projects
        url: https://projects.stuxie.dev/
        description: Everything StuxieDev builds, in one place
      - name: TIGHC
        url: https://tighc.stuxie.dev/
        description: The TIGHC website
      - name: TS4RLS
        url: https://ts4rls.stuxie.dev/
        description: The TS4RLS website
      - name: TWRAR
        url: https://twrar.stuxie.dev/
        description: The TWRAR website

  - name: StuxieDev Archives
    description: A stable frame around StuxieDev's retired sites, reachable on four domains.
    monitors:
      - name: archives.stuxie.dev
        url: https://archives.stuxie.dev/
        description: The StuxieDev Archives
      - name: archives.stuxiedev.com
        url: https://archives.stuxiedev.com/
        description: The StuxieDev Archives, on its second domain

  - name: Related
    description: Related projects. These are plain links, not monitored here.
    links:
      - name: RoboStux
        url: https://robo.st
        description: The RoboStux website
      - name: RoboStux Status
        url: https://status.robo.st
        description: RoboStux's own status page, which monitors the bot and its services

incidents:
  labels: [status]
